<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Medicine</title>
    <style>
        body { font-family: Arial; background: #f4f7f6; }
        nav { background: #2c3e50; padding: 1rem; color: white; text-align: center; }
        .container { padding: 2rem; max-width: 600px; margin: auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .results { background: white; padding: 1rem; border-radius: 8px; min-height: 100px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <nav>Pharmacy Inventory Search</nav>
    <div class="container">
        <div class="search-box">
            <input type="text" id="medInput" placeholder="Enter medicine name (e.g. Panadol)...">
            <button onclick="searchMed()">Search</button>
        </div>
        <div class="results" id="resultArea">Results will appear here...</div>
    </div>
    <script>
        function searchMed() {
            const input = document.getElementById('medInput').value;
            const res = document.getElementById('resultArea');
            if(input.toLowerCase() === 'panadol') {
                res.innerHTML = "<strong>Status:</strong> In Stock <br> <strong>Price:</strong> $5.00 <br> <strong>Shelf:</strong> A-12";
                res.style.color = "green";
            } else {
                res.innerHTML = "Not found in current inventory.";
                res.style.color = "red";
            }
        }
    </script>
</body>
</html>
