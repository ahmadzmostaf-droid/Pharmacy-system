<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Medicine</title>
    <style>
        body { font-family: Arial; margin: 0; background: #f4f7f6; }
        nav { background: #2c3e50; padding: 1rem; color: white; text-align: center; }
        .container { padding: 2rem; max-width: 500px; margin: auto; }
        .card { background: white; padding: 2rem; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
        button { background: #2980b9; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .link { display: block; margin-top: 15px; color: #2980b9; text-decoration: none; }
    </style>
</head>
<body>
    <nav>Pharmacy Management - Control Panel</nav>
    <div class="container">
        <div class="card">
            <h3>Add New Medicine</h3>
            <input type="text" placeholder="Medicine Name">
            <input type="number" placeholder="Price ($)">
            <input type="number" placeholder="Quantity">
            <button onclick="alert('Medicine Added Successfully!')">Add to Inventory</button>
            <a href="search.html" class="link">Go to Search Page →</a>
        </div>
    </div>
</body>
</html>
