name: Phase_1_Testing
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and Run Tests
        run: |
          cd Login_test
          npm install --save-dev jest
          npm test